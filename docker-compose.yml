version: "3.9"

services:
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    env_file:
      - .env.example
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  project-manager-agent:
    build: ./project-manager-agent
    container_name: project-manager-agent
    env_file:
      - ./project-manager-agent/.env  # Указываем путь к .env в подпапке
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    # Для разработки можно добавить volumes:
    # volumes:
    #   - ./project-manager-agent/src:/app/src
    #   - ./project-manager-agent/.env:/app/.env

volumes:
  n8n_data: